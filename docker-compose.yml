version: "3.9"

services:
  backend:
    build: ./backend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - PORTAL_LOCATION_ENCRYPTION_KEY=${PORTAL_LOCATION_ENCRYPTION_KEY}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    # State is in-memory: run a single worker; no sticky sessions needed for /ws/voice.

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
