name: CI

on:
  push:
    branches: [main, fix/production-hardening]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e . && pip install pyflakes pytest pytest-asyncio cachetools
      - name: pyflakes
        run: python -m pyflakes modules
      - name: import main
        env:
          GROQ_API_KEY: test
          DEEPGRAM_API_KEY: test
          PORTAL_LOCATION_ENCRYPTION_KEY: test-key
        run: python -c "import main"
      - name: pytest
        env:
          GROQ_API_KEY: test
          DEEPGRAM_API_KEY: test
          PORTAL_LOCATION_ENCRYPTION_KEY: test-key
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
