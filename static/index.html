<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voice AI — SIP Realtime</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e2f0;
      padding: 20px;
    }

    .card {
      width: 550px;
      max-width: 100%;
      padding: 45px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      color: #8888a0;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .label {
      font-size: 13px;
      color: #8d8da5;
      margin-bottom: 8px;
    }

    .box {
      min-height: 80px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d8d8e8;
      line-height: 1.5;
      word-break: break-word;
    }

    .section {
      text-align: left;
      margin-top: 20px;
    }

    .interim {
      color: #8888a0;
    }

    button {
      width: 100%;
      padding: 13px 30px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .sip-credentials {
      text-align: left;
      margin-bottom: 10px;
    }

    .input-group {
      margin-top: 14px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #8d8da5;
      margin-bottom: 7px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e2f0;
      outline: none;
      font-size: 14px;
    }

    .input-group input:focus {
      border-color: rgba(139, 92, 246, 0.7);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.12);
    }

    .input-group input::placeholder {
      color: #66667a;
    }

    #sipRegisterBtn {
      color: white;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    #sipRegisterBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
    }

    #testBtn {
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.35);
    }

    #testBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(139, 92, 246, 0.25);
    }

    #hangupBtn {
      color: #fecaca;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      display: none;
    }

    #status {
      min-height: 25px;
      margin-top: 25px;
      color: #9999b0;
      font-size: 14px;
    }

    #status.success {
      color: #4ade80;
    }

    #status.error {
      color: #f87171;
    }

    .pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 8px;
      border-radius: 50%;
      background: #f87171;
      animation: pulse 1s infinite;
    }

    .sip-info {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: #8888a0;
      font-size: 12px;
      text-align: left;
    }

    audio {
      display: none;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.7);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Voice AI</h1>

    <div class="description">
      Incoming SIP calls are automatically answered by AI.
    </div>

    <div class="sip-credentials">
      <div class="input-group">
        <label for="sipDomain">SIP Domain</label>
        <input
          type="text"
          id="sipDomain"
          placeholder="Enter SIP domain"
          autocomplete="off"
        >
      </div>

      <div class="input-group">
        <label for="sipUsername">SIP Username</label>
        <input
          type="text"
          id="sipUsername"
          placeholder="Enter SIP username"
          autocomplete="username"
        >
      </div>

      <div class="input-group">
        <label for="sipPassword">SIP Password</label>
        <input
          type="password"
          id="sipPassword"
          placeholder="Enter SIP password"
          autocomplete="current-password"
        >
      </div>
    </div>

    <button id="sipRegisterBtn">
      Start SIP
    </button>

    <button id="testBtn">
      Test with Microphone (no call)
    </button>

    <button id="hangupBtn">
      Hang Up / Stop Test
    </button>

    <!--
      Caller audio is attached here for two reasons: local debugging, and
      because Chrome only delivers remote WebRTC audio to Web Audio nodes
      when the stream is also attached to a playing media element.
      The AI's audio is routed directly into the SIP PeerConnection.
    -->
    <audio
      id="remoteAudio"
      autoplay
      playsinline>
    </audio>

    <div class="section">
      <div class="label">Caller</div>
      <div id="transcript" class="box">Waiting for caller...</div>
    </div>

    <div class="section">
      <div class="label">AI Assistant</div>
      <div id="response" class="box">AI response will appear here...</div>
    </div>

    <div class="sip-info">
      SIP extension: <strong>1001</strong>
      <br>
      Waiting for incoming calls...
    </div>

    <div id="status">SIP not started</div>

  </div>


  <script type="module">

    import {
      UserAgent,
      Registerer,
      SessionState
    } from "https://esm.sh/sip.js@0.20.0";

    console.log("SIP.js ES module loaded:", { UserAgent, Registerer, SessionState });

    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const SIP_WS = "wss://sip.begindaily.in:7443/";

    // SIP credentials are entered by the user before registration.
    let SIP_DOMAIN = "";
    let SIP_USERNAME = "";
    let SIP_PASSWORD = "";

    // Sample rate of the PCM sent to the backend. Must match INPUT_SAMPLE_RATE
    // in modules/realtime, because Deepgram's /v1/listen connection there is
    // opened with sample_rate=16000.
    //
    // The AudioContext is forced to this rate (same as the working mic page),
    // so the worklet passes samples straight through. Firefox refuses to
    // connect a MediaStreamSource across mismatched rates, so there the
    // context runs at the default rate and the worklet downsamples instead.
    const INPUT_SAMPLE_RATE = 16000;

    // Logs the peak level of the caller audio every second, plus a warning if
    // it stays at pure silence. Tells you whether caller audio is actually
    // reaching the worklet:
    //   no "[input] first frame" line -> the audio graph isn't running
    //   frames arrive but peak is 0    -> the caller track is silent (no RTP)
    //   peak > 0 but no transcripts    -> problem is on the backend side
    const DEBUG_INPUT_LEVEL = true;

    // How long to wait after answering before warning that no caller audio
    // has arrived — helps distinguish "media never arrived" from "media
    // arrived but the AI pipeline failed".
    const NO_MEDIA_WARN_MS = 8000;

    // Logs inbound RTP byte counts 3s and 8s after answering. If bytesReceived
    // stays at 0, the problem is the network path (ICE / media relay / TURN),
    // not this code.
    const DEBUG_MEDIA_STATS = true;


    /* =========================================================
       UI
    ========================================================= */

    const registerBtn = document.getElementById("sipRegisterBtn");
    const sipDomainInput = document.getElementById("sipDomain");
    const sipUsernameInput = document.getElementById("sipUsername");
    const sipPasswordInput = document.getElementById("sipPassword");
    const testBtn = document.getElementById("testBtn");
    const hangupBtn = document.getElementById("hangupBtn");
    const remoteAudio = document.getElementById("remoteAudio");
    const transcriptEl = document.getElementById("transcript");
    const responseEl = document.getElementById("response");
    const statusEl = document.getElementById("status");


    function setStatus(html, type = "") {
      statusEl.className = type;
      statusEl.innerHTML = html;
    }


    /* =========================================================
       SIP STATE
    ========================================================= */

    let userAgent = null;
    let registerer = null;
    let isRegistered = false;
    let sipSession = null;
    let sipPeerConnection = null;
    let sipAudioSender = null;
    let noMediaTimer = null;

    // Incremented every time a call is cleaned up. Async work started for an
    // earlier call checks this and bails out if the call it belonged to is over.
    let callGeneration = 0;


    /* =========================================================
       VOICE AI STATE
    ========================================================= */

    let aiWs = null;
    let aiAudioContext = null;
    let aiWorkletContext = null; // the context the worklet module was loaded into
    let aiInputNode = null;
    let aiInputWorklet = null;
    let aiSilentGain = null;
    let aiOutputDestination = null;
    let aiOutputGain = null;
    let aiOutputNextTime = 0;
    let aiOutputSources = [];
    let ttsRate = 24000;
    let carry = new Uint8Array(0);
    let finalText = "";
    let answerText = "";

    // True while running the "Test AI Audio (no call)" flow — lets Hang Up
    // clean up a test session the same way it cleans up a real call.
    let testModeActive = false;
    let testMicStream = null;


    /* =========================================================
       AUDIO WORKLET

       Takes caller audio at the AudioContext's rate, downsamples it to
       INPUT_SAMPLE_RATE (box-filter average, so no aliasing garbage),
       converts to PCM16 and posts it in 20ms frames for /ws/voice.
    ========================================================= */

    const pcmWorkletSource = `
      class PCMProcessor extends AudioWorkletProcessor {
        constructor(options) {
          super();

          const opts = options.processorOptions || {};
          const targetRate = opts.targetRate || sampleRate;

          // Input samples consumed per output sample (3 for 48k -> 16k).
          this.step = sampleRate / targetRate;
          this.phase = 0;
          this.sum = 0;
          this.count = 0;

          // 20ms of audio at the target rate.
          this.frame = new Int16Array(Math.round(targetRate * 0.02));
          this.filled = 0;
        }

        process(inputs) {
          const channel = inputs[0] && inputs[0][0];
          if (!channel) return true;

          for (let i = 0; i < channel.length; i++) {
            this.sum += channel[i];
            this.count++;
            this.phase += 1;

            if (this.phase >= this.step) {
              this.phase -= this.step;

              const avg = this.sum / this.count;
              this.sum = 0;
              this.count = 0;

              const sample = Math.max(-1, Math.min(1, avg));
              this.frame[this.filled++] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;

              if (this.filled === this.frame.length) {
                const out = this.frame.slice().buffer;
                this.port.postMessage(out, [out]);
                this.filled = 0;
              }
            }
          }

          return true;
        }
      }

      registerProcessor("pcm-processor", PCMProcessor);
    `;


    /* =========================================================
       LOAD THE WORKLET (once per AudioContext)
    ========================================================= */

    async function ensurePCMWorklet(audioContext) {
      if (aiWorkletContext === audioContext) return;

      const blob = new Blob([pcmWorkletSource], { type: "application/javascript" });
      const url = URL.createObjectURL(blob);

      try {
        await audioContext.audioWorklet.addModule(url);
      } finally {
        URL.revokeObjectURL(url);
      }

      aiWorkletContext = audioContext;
    }


    /* =========================================================
       GET OR CREATE THE SHARED AUDIO CONTEXT

       One context lives for the whole page. It is created (and resumed)
       from the Start SIP / Test button click, so the browser's autoplay
       policy lets it run when a call arrives later without a click.

       It is forced to INPUT_SAMPLE_RATE (16kHz), exactly like the working
       mic page, so caller audio reaches Deepgram at the rate it expects.
       TTS chunks are created at their real rate (ttsRate) and resampled by
       Web Audio on playback, so that still works at 16kHz.
    ========================================================= */

    function createInputAudioContext() {
      const isFirefox = /firefox/i.test(navigator.userAgent);

      if (!isFirefox) {
        try {
          return new AudioContext({ sampleRate: INPUT_SAMPLE_RATE });
        } catch (error) {
          console.warn("Browser rejected explicit sampleRate, using default:", error);
        }
      }

      /* Default rate: the worklet downsamples to INPUT_SAMPLE_RATE itself. */
      return new AudioContext();
    }

    async function getAudioContext() {
      if (!aiAudioContext || aiAudioContext.state === "closed") {
        aiAudioContext = createInputAudioContext();
        aiWorkletContext = null;

        console.log(
          "AI audio context sample rate:",
          aiAudioContext.sampleRate,
          aiAudioContext.sampleRate === INPUT_SAMPLE_RATE
            ? "(matches backend)"
            : "(worklet will downsample to " + INPUT_SAMPLE_RATE + ")"
        );
      }

      if (aiAudioContext.state === "suspended") {
        // Don't let a blocked resume() hang the whole call setup.
        await Promise.race([
          aiAudioContext.resume(),
          new Promise((resolve) => setTimeout(resolve, 2000))
        ]);

        if (aiAudioContext.state === "suspended") {
          console.warn(
            "AudioContext is still suspended — click Start SIP once so the " +
            "browser allows audio for this page."
          );
        }
      }

      return aiAudioContext;
    }


    /* =========================================================
       START AI AUDIO PIPELINE
    ========================================================= */

    async function startVoiceAI(remoteStream) {
      console.log("Starting Voice AI with SIP audio");

      if (aiWs) {
        console.log("AI WebSocket already exists");
        return;
      }

      const generation = callGeneration;

      const audioContext = await getAudioContext();
      await ensurePCMWorklet(audioContext);

      if (generation !== callGeneration) {
        console.log("Call ended while starting Voice AI — aborting");
        return;
      }

      /* SIP remote audio */
      aiInputNode = audioContext.createMediaStreamSource(remoteStream);

      /* PCM processor: downmixes to mono and downsamples to INPUT_SAMPLE_RATE */
      aiInputWorklet = new AudioWorkletNode(audioContext, "pcm-processor", {
        numberOfInputs: 1,
        numberOfOutputs: 1,
        outputChannelCount: [1],
        channelCount: 1,
        channelCountMode: "explicit",
        processorOptions: { targetRate: INPUT_SAMPLE_RATE }
      });

      /* Send SIP caller audio to Voice AI WebSocket */
      let frameCount = 0;
      let peak = 0;
      let silentSeconds = 0;

      aiInputWorklet.port.onmessage = (event) => {
        if (aiWs && aiWs.readyState === WebSocket.OPEN) {
          aiWs.send(event.data);
        }

        if (!DEBUG_INPUT_LEVEL) return;

        if (frameCount === 0) {
          console.log("[input] first frame from worklet — audio graph is running");
        }

        const samples = new Int16Array(event.data);

        for (let i = 0; i < samples.length; i++) {
          const level = Math.abs(samples[i]);
          if (level > peak) peak = level;
        }

        /* 50 frames x 20ms = 1 second */
        if (++frameCount % 50 === 0) {
          console.log(`[input] peak in last second: ${peak} / 32767`);

          silentSeconds = peak === 0 ? silentSeconds + 1 : 0;
          peak = 0;

          if (silentSeconds === 3) {
            console.warn(
              "[input] caller audio has been pure silence for 3s. The track " +
              "exists but no usable audio is flowing — check the [stats] " +
              "bytesReceived lines (0 = RTP never arrives: ICE/TURN/media relay)."
            );
          }
        }
      };

      /*
       * Connect caller audio to processor.
       * IMPORTANT: we don't connect this directly to destination,
       * that would create an echo. The zero-gain node just keeps the
       * graph "pulled" so the worklet keeps running.
       */
      aiSilentGain = audioContext.createGain();
      aiSilentGain.gain.value = 0;

      aiInputNode.connect(aiInputWorklet);
      aiInputWorklet.connect(aiSilentGain);
      aiSilentGain.connect(audioContext.destination);

      connectAIWebSocket();
    }


    /* =========================================================
       CONNECT TO /ws/voice
    ========================================================= */

    function connectAIWebSocket() {
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      const aiWsUrl = `${scheme}://${location.host}/ws/voice`;

      console.log("Connecting Voice AI WebSocket:", aiWsUrl);

      const socket = new WebSocket(aiWsUrl);
      socket.binaryType = "arraybuffer";
      aiWs = socket;

      socket.onopen = () => {
        console.log("Voice AI WebSocket connected");
        setStatus('<span class="pulse"></span>Caller connected — AI listening', "success");
      };

      socket.onmessage = (event) => {
        /* Ignore anything from a socket that belongs to a finished call. */
        if (socket !== aiWs) return;

        /* Binary = TTS audio */
        if (typeof event.data !== "string") {
          enqueueTTS(event.data);
          return;
        }

        const msg = JSON.parse(event.data);

        if (msg.type === "ready") {
          ttsRate = msg.ttsSampleRate || 24000;
          console.log("TTS sample rate:", ttsRate);
        }

        else if (msg.type === "transcript") {
          if (msg.final) {
            finalText = (finalText + " " + msg.text).trim();
            transcriptEl.textContent = finalText;
          } else {
            transcriptEl.innerHTML =
              finalText + ' <span class="interim">' + msg.text + "</span>";
          }
        }

        else if (msg.type === "user") {
          finalText = "";
          transcriptEl.textContent = msg.text;
          setStatus('<span class="pulse"></span>AI is thinking...');
        }

        else if (msg.type === "answer_start") {
          answerText = "";
          responseEl.textContent = "";
        }

        else if (msg.type === "token") {
          answerText += msg.text;
          responseEl.textContent = answerText;
        }

        else if (msg.type === "answer_end") {
          setStatus('<span class="pulse"></span>AI speaking / listening', "success");
        }

        else if (msg.type === "interrupt") {
          stopTTSPlayback();
        }

        else if (msg.type === "error") {
          console.error("AI error:", msg.message);
          setStatus("AI error: " + msg.message, "error");
        }
      };

      socket.onerror = (error) => {
        console.error("AI WebSocket error:", error);
        if (socket === aiWs) {
          setStatus("Voice AI connection failed", "error");
        }
      };

      socket.onclose = (event) => {
        console.log("Voice AI WebSocket closed", "code:", event.code, "reason:", event.reason);

        /* A late close from an old call must not touch the current call. */
        if (socket !== aiWs) return;

        if (event.code !== 1000 && event.code !== 1005) {
          setStatus(
            `AI connection closed unexpectedly (code ${event.code}${event.reason ? ": " + event.reason : ""})`,
            "error"
          );
        }

        aiWs = null;
      };
    }


    /* =========================================================
       TTS OUTPUT GRAPH

       TTS PCM16 from /ws/voice is scheduled into aiOutputGain, which feeds
       a MediaStreamDestination (that stream becomes the SIP outgoing audio)
       and also the local speakers for debugging — which is what makes the
       no-call test audible.

       Idempotent and synchronous on purpose: if it created a second graph,
       audio already queued on the first would never reach the caller.
    ========================================================= */

    function initializeTTSOutput() {
      const audioContext = aiAudioContext;

      if (!audioContext) {
        throw new Error("AudioContext is not ready");
      }

      if (aiOutputDestination) return;

      aiOutputDestination = audioContext.createMediaStreamDestination();

      aiOutputGain = audioContext.createGain();
      aiOutputGain.gain.value = 1;
      aiOutputGain.connect(aiOutputDestination);

      /* Local playback — AI audio is always also played locally. */
      aiOutputGain.connect(audioContext.destination);
    }


    /* =========================================================
       SEND AI AUDIO INTO SIP
    ========================================================= */

    async function routeAIToSIP() {
      if (!sipPeerConnection) {
        console.error("SIP PeerConnection not available");
        return;
      }

      initializeTTSOutput();

      const aiStream = aiOutputDestination.stream;
      const aiTrack = aiStream.getAudioTracks()[0];

      if (!aiTrack) {
        console.error("AI output audio track not found");
        return;
      }

      const senders = sipPeerConnection.getSenders();

      sipAudioSender = senders.find(
        (sender) => sender.track && sender.track.kind === "audio"
      );

      if (sipAudioSender) {
        /* Existing negotiated audio m-line — no renegotiation needed. */
        await sipAudioSender.replaceTrack(aiTrack);
        console.log("AI audio track attached to SIP (replaceTrack, no renegotiation needed)");
      } else {
        /*
         * No existing audio sender — this means the call was answered
         * without a local mic track (e.g. getUserMedia never succeeded).
         * addTrack() alone will NOT reach the remote party without a
         * renegotiation (re-INVITE), so we trigger one explicitly here.
         */
        sipAudioSender = sipPeerConnection.addTrack(aiTrack, aiStream);
        console.warn(
          "No existing audio sender found — used addTrack, which requires " +
          "renegotiation. This usually means mic permission was not granted " +
          "before the call. Attempting a re-INVITE now."
        );

        try {
          if (sipSession && typeof sipSession.invite === "function") {
            await sipSession.invite();
            console.log("Renegotiation (re-INVITE) completed");
          } else {
            console.error(
              "No renegotiation method available on the session — the " +
              "remote party will NOT hear AI audio. Grant mic permission " +
              "before the call arrives to avoid this path entirely."
            );
          }
        } catch (error) {
          console.error("Renegotiation failed:", error);
        }
      }
    }


    /* =========================================================
       QUEUE TTS PCM

       Deliberately synchronous (no awaits) so chunks are scheduled in
       exactly the order they arrive.
    ========================================================= */

    function enqueueTTS(arrayBuffer) {
      const audioContext = aiAudioContext;

      if (!audioContext) return;

      initializeTTSOutput();

      let bytes = new Uint8Array(arrayBuffer);

      /* Handle an odd byte from previous chunk. */
      if (carry.length) {
        const merged = new Uint8Array(carry.length + bytes.length);
        merged.set(carry);
        merged.set(bytes, carry.length);
        bytes = merged;
        carry = new Uint8Array(0);
      }

      const usable = bytes.length - (bytes.length % 2);

      if (usable < bytes.length) {
        carry = bytes.slice(usable);
      }

      if (!usable) return;

      const pcm = new Int16Array(
        bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + usable)
      );

      const buffer = audioContext.createBuffer(1, pcm.length, ttsRate);
      const channel = buffer.getChannelData(0);

      for (let i = 0; i < pcm.length; i++) {
        channel[i] = pcm[i] / 32768;
      }

      const source = audioContext.createBufferSource();
      source.buffer = buffer;

      /*
       * IMPORTANT: route TTS into the MediaStreamDestination.
       * That MediaStream becomes the SIP outgoing audio.
       */
      source.connect(aiOutputGain);

      const now = audioContext.currentTime;

      if (aiOutputNextTime < now + 0.05) {
        aiOutputNextTime = now + 0.05;
      }

      source.start(aiOutputNextTime);
      aiOutputNextTime += buffer.duration;

      aiOutputSources.push(source);

      source.onended = () => {
        aiOutputSources = aiOutputSources.filter((item) => item !== source);
      };
    }


    /* =========================================================
       STOP TTS
    ========================================================= */

    function stopTTSPlayback() {
      aiOutputSources.forEach((source) => {
        try {
          source.stop();
        } catch (error) {}
      });

      aiOutputSources = [];
      aiOutputNextTime = 0;
      carry = new Uint8Array(0);
    }


    /* =========================================================
       WAIT FOR SIP SESSION DESCRIPTION HANDLER
    ========================================================= */

    async function waitForSessionDescriptionHandler(session, timeoutMs = 10000) {
      const startedAt = Date.now();

      while (!session.sessionDescriptionHandler) {
        if (Date.now() - startedAt >= timeoutMs) {
          throw new Error("Session Description Handler was not created within the timeout.");
        }

        await new Promise((resolve) => setTimeout(resolve, 100));
      }

      return session.sessionDescriptionHandler;
    }


    /* =========================================================
       MEDIA DIAGNOSTICS
    ========================================================= */

    function clearNoMediaTimer() {
      if (noMediaTimer) {
        clearTimeout(noMediaTimer);
        noMediaTimer = null;
      }
    }

    function armNoMediaTimer() {
      clearNoMediaTimer();

      noMediaTimer = setTimeout(() => {
        noMediaTimer = null;

        setStatus(
          "No caller audio received — check SIP/ICE media path (see console)",
          "error"
        );

        console.warn(
          `No caller RTP within ${NO_MEDIA_WARN_MS}ms of answering. ` +
          "This points to a SIP/ICE/media-relay issue (e.g. FreeSWITCH/Kamailio " +
          "not routing RTP to this browser leg, or ICE negotiation failing), " +
          "not an app-code issue."
        );
      }, NO_MEDIA_WARN_MS);
    }

    async function logInboundAudioStats(pc, label) {
      if (pc !== sipPeerConnection) return;

      try {
        const stats = await pc.getStats();

        stats.forEach((report) => {
          if (report.type === "inbound-rtp" && report.kind === "audio") {
            console.log(
              `[stats ${label}] inbound audio — bytes: ${report.bytesReceived}, ` +
              `packets: ${report.packetsReceived}`
            );
          }
        });
      } catch (error) {
        console.warn("getStats failed:", error);
      }
    }


    /* =========================================================
       ATTACH REMOTE SIP AUDIO

       SIP.js applies the caller's SDP offer inside accept(), so the
       remote audio track usually exists BEFORE we get here — a "track"
       event listener attached now would never fire. So:

         1. read tracks that are already on the receivers, and
         2. only fall back to waiting for a "track" event if none exist.

       addEventListener (not ontrack =) so SIP.js's own handler is not
       overwritten.
    ========================================================= */

    async function attachRemoteAudio(session) {
      console.log("Waiting for SIP SessionDescriptionHandler...");

      const generation = callGeneration;
      const handler = await waitForSessionDescriptionHandler(session);
      const pc = handler.peerConnection;

      if (!pc) {
        throw new Error("SIP PeerConnection is not available.");
      }

      sipPeerConnection = pc;

      console.log("SIP PeerConnection:", pc);

      /* Diagnostic: does an audio sender already exist? Tells us up front
         whether replaceTrack or the addTrack/renegotiate path will run. */
      const existingSenders = pc.getSenders();
      console.log(
        "Senders immediately after accept():",
        existingSenders.map((s) => s.track && s.track.kind).filter(Boolean)
      );

      if (!existingSenders.some((s) => s.track && s.track.kind === "audio")) {
        console.warn(
          "No local audio sender present right after accept() — mic " +
          "getUserMedia likely did not succeed. AI audio will need a " +
          "renegotiation to reach the caller (see routeAIToSIP)."
        );
      }

      if (DEBUG_MEDIA_STATS) {
        setTimeout(() => logInboundAudioStats(pc, "3s"), 3000);
        setTimeout(() => logInboundAudioStats(pc, "8s"), 8000);
      }

      let started = false;

      /* A track can exist but stay "muted" until RTP actually arrives. */
      const watchTrack = (track) => {
        clearNoMediaTimer();

        if (!track.muted) return;

        armNoMediaTimer();
        track.addEventListener("unmute", clearNoMediaTimer, { once: true });
      };

      const beginAI = async (stream) => {
        if (started) return;
        started = true;

        if (generation !== callGeneration) return;

        console.log("Caller audio track available — starting AI pipeline");

        /* Keep this: Chrome needs a remote stream attached to a playing
           element before Web Audio nodes receive data from it. */
        remoteAudio.srcObject = stream;
        remoteAudio.play().catch((error) => {
          console.warn("Remote audio playback blocked:", error);
        });

        /*
         * Build the AI -> SIP path BEFORE opening /ws/voice, so the
         * greeting (which the backend sends immediately) already has a
         * route to the caller when its first audio chunk arrives.
         */
        try {
          await getAudioContext();

          if (generation !== callGeneration) return;

          initializeTTSOutput();
          await routeAIToSIP();
        } catch (error) {
          console.error("Failed to route AI audio into SIP:", error);
        }

        if (generation !== callGeneration) return;

        await startVoiceAI(stream);
      };

      /* 1) Tracks negotiated during accept() are already on the receivers. */
      const existingTracks = pc
        .getReceivers()
        .map((receiver) => receiver.track)
        .filter((track) => track && track.kind === "audio");

      if (existingTracks.length) {
        console.log("Remote audio track already present after accept()");

        watchTrack(existingTracks[0]);
        await beginAI(new MediaStream(existingTracks));

        return pc;
      }

      /* 2) Otherwise wait for it. */
      console.log("No remote audio track yet — waiting for track event");

      pc.addEventListener("track", (event) => {
        if (event.track.kind !== "audio") return;

        console.log("Incoming SIP audio track received");

        watchTrack(event.track);

        const stream =
          event.streams && event.streams.length
            ? event.streams[0]
            : new MediaStream([event.track]);

        beginAI(stream).catch((error) => {
          console.error("Failed to start AI pipeline:", error);
          setStatus("Failed to start AI pipeline: " + error.message, "error");
        });
      });

      armNoMediaTimer();

      return pc;
    }


    /* =========================================================
       MIC PERMISSION PRE-CHECK

       SIP.js's default session description handler calls
       getUserMedia({audio:true}) when accepting an invite. If the
       browser tab doesn't already have mic permission, that call can
       fail or hang silently inside SIP.js, leaving the PeerConnection
       with no local audio sender — which breaks the replaceTrack path
       AI audio relies on. Ask for permission up front instead, so any
       failure is visible immediately.
    ========================================================= */

    async function ensureMicPermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((track) => track.stop());
        console.log("Microphone permission confirmed");
        return true;
      } catch (error) {
        console.error("Microphone permission check failed:", error);
        setStatus(
          "Microphone permission denied — incoming calls will not get AI audio. " +
          "Allow microphone access and reload.",
          "error"
        );
        return false;
      }
    }


    /* =========================================================
       TEST AI AUDIO (NO CALL)

       Exercises the exact same /ws/voice -> greeting -> TTS ->
       playback path a real call uses, minus the SIP routing step
       (routeAIToSIP). Useful for confirming the backend, Deepgram
       TTS, and the greeting flow all work correctly, independent of
       whether SIP/ICE media is currently reaching the browser.

       You should hear the greeting out of your speakers and see
       "[ws] /ws/voice connection accepted" plus "[turn] greeting
       done" in the backend terminal if this works.
    ========================================================= */

    async function testAIPipeline() {
      if (aiWs || sipSession) {
        console.log("A voice session is already active — hang up first.");
        return;
      }

      testModeActive = true;
      hangupBtn.style.display = "block";

      transcriptEl.textContent = "(no call — speak into your microphone)";
      responseEl.textContent = "AI response will appear here...";

      setStatus('<span class="pulse"></span>Testing with your microphone (no call)...');

      try {
        await getAudioContext();
        initializeTTSOutput();

        testMicStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        console.log(
          "[test] microphone acquired — sending it through the same " +
          "worklet -> /ws/voice -> Deepgram path a call uses"
        );

        await startVoiceAI(testMicStream);
      } catch (error) {
        console.error("Test pipeline failed:", error);

        cleanupCall();
        setStatus("Test failed: " + error.message, "error");
      }
    }


    /* =========================================================
       INITIALIZE SIP USER AGENT
    ========================================================= */

    async function initializeSIP() {
      try {
        if (!UserAgent || !Registerer) {
          throw new Error("SIP.js ES module did not load correctly.");
        }

        console.log("SIP.js ES module is available.");

        const micOk = await ensureMicPermission();
        if (!micOk) {
          return;
        }

        setStatus("Starting SIP...");

        const uri = UserAgent.makeURI(`sip:${SIP_USERNAME}@${SIP_DOMAIN}`);

        if (!uri) {
          throw new Error("Invalid SIP URI");
        }

        userAgent = new UserAgent({
          uri,

          transportOptions: {
            server: SIP_WS,
            traceSip: true
          },

          authorizationUsername: SIP_USERNAME,
          authorizationPassword: SIP_PASSWORD,

          sessionDescriptionHandlerFactoryOptions: {
            constraints: {
              audio: true,
              video: false
            },

            peerConnectionConfiguration: {
              iceServers: [
                { urls: "stun:stun.l.google.com:19302" }

                /*
                 * If calls answer but no caller audio ever arrives
                 * (see the "No caller audio received" warning above, or
                 * bytesReceived staying at 0 in the [stats] logs),
                 * add a TURN server here — STUN alone is often not
                 * enough when either leg is behind a restrictive NAT.
                 *
                 * {
                 *   urls: "turn:your-turn-server",
                 *   username: "...",
                 *   credential: "..."
                 * }
                 */
              ]
            }
          }
        });

        /* ===================================================
           INCOMING CALL
        =================================================== */

        userAgent.delegate = {
          onInvite: async (invitation) => {
            console.log("================================");
            console.log("INCOMING SIP CALL");
            console.log("================================");

            /* Already on a call (or running the pipeline test): decline. */
            if (sipSession || testModeActive) {
              console.warn("Busy — rejecting second incoming call");

              try {
                await invitation.reject({ statusCode: 486 });
              } catch (error) {
                console.error("Failed to reject second call:", error);
              }

              return;
            }

            try {
              sipSession = invitation;

              /*
               * If the caller hangs up (or the call drops), tear everything
               * down. Without this, the old WebSocket stays open and the next
               * call's startVoiceAI() exits early on `if (aiWs)`.
               * The identity check stops a late event from an old call
               * from cleaning up a newer one.
               */
              invitation.stateChange.addListener((state) => {
                console.log("SIP session state:", state);

                if (state === SessionState.Terminated && sipSession === invitation) {
                  cleanupCall();
                }
              });

              hangupBtn.style.display = "block";

              setStatus('<span class="pulse"></span>Incoming call — answering...');

              /*
               * Automatically answer first.
               *
               * IMPORTANT: SIP.js creates the SessionDescriptionHandler
               * during session establishment, so it only exists after
               * accept() has been called.
               */
              await invitation.accept({
                sessionDescriptionHandlerOptions: {
                  constraints: {
                    audio: true,
                    video: false
                  }
                }
              });

              console.log("SIP call answered");

              /*
               * Now that the call is established, the
               * SessionDescriptionHandler/PeerConnection exists.
               * Attach the media handler and start the AI pipeline.
               */
              await attachRemoteAudio(invitation);

              console.log("SIP remote audio handler attached");

              /* Don't overwrite the "AI listening" status if the
                 WebSocket has already connected. */
              if (!aiWs && sipSession === invitation) {
                setStatus(
                  '<span class="pulse"></span>Call answered — waiting for caller audio',
                  "success"
                );
              }
            } catch (error) {
              console.error("Failed to answer SIP call:", error);
              setStatus("Failed to answer call", "error");
            }
          }
        };

        /* ===================================================
           START USER AGENT
        =================================================== */

        await userAgent.start();

        console.log("SIP UserAgent started");

        /* ===================================================
           REGISTER EXTENSION

           SIP.js 0.20 uses Registerer to send the REGISTER
           request and keep the registration alive.
        =================================================== */

        if (!Registerer) {
          throw new Error("SIP.js Registerer is unavailable.");
        }

        registerer = new Registerer(userAgent);
        await registerer.register();

        console.log("SIP registration successful");

        isRegistered = true;

        setStatus(
          '<span class="pulse"></span>Registered — waiting for incoming call',
          "success"
        );

        registerBtn.textContent = "SIP Registered";
        registerBtn.disabled = true;
      } catch (error) {
        console.error("SIP initialization error:", error);
        setStatus("SIP registration failed: " + error.message, "error");
      }
    }


    /* =========================================================
       CLEAN UP A CALL (or a pipeline test)

       Synchronous and idempotent: safe to call from the remote-hangup
       listener AND from the Hang Up button, in either order, twice.

       Keeps the AudioContext alive across calls (it was created from a
       user click, so the browser lets it keep running) and only tears
       down the per-call nodes.
    ========================================================= */

    function cleanupCall() {
      callGeneration++;

      clearNoMediaTimer();

      /* Voice AI WebSocket. Detach first so its onclose can't touch state. */
      const socket = aiWs;
      aiWs = null;

      if (
        socket &&
        (socket.readyState === WebSocket.OPEN ||
          socket.readyState === WebSocket.CONNECTING)
      ) {
        try {
          socket.close(1000, "call ended");
        } catch (error) {}
      }

      /* TTS. */
      stopTTSPlayback();

      /* Per-call audio graph. */
      if (aiInputWorklet) {
        aiInputWorklet.port.onmessage = null;
      }

      [aiInputNode, aiInputWorklet, aiSilentGain, aiOutputGain, aiOutputDestination]
        .forEach((node) => {
          if (!node) return;

          try {
            node.disconnect();
          } catch (error) {}
        });

      aiInputNode = null;
      aiInputWorklet = null;
      aiSilentGain = null;
      aiOutputDestination = null;
      aiOutputGain = null;
      aiOutputSources = [];
      aiOutputNextTime = 0;
      carry = new Uint8Array(0);

      /* Test-mode microphone. */
      if (testMicStream) {
        testMicStream.getTracks().forEach((track) => track.stop());
        testMicStream = null;
      }

      /* SIP references. */
      sipSession = null;
      sipPeerConnection = null;
      sipAudioSender = null;
      remoteAudio.srcObject = null;
      testModeActive = false;

      /* UI. */
      hangupBtn.style.display = "none";
      transcriptEl.textContent = "Waiting for caller...";
      responseEl.textContent = "AI response will appear here...";

      finalText = "";
      answerText = "";

      if (isRegistered) {
        setStatus(
          '<span class="pulse"></span>Registered — waiting for incoming call',
          "success"
        );
      } else {
        setStatus("SIP not started");
      }
    }


    /* =========================================================
       HANG UP SIP CALL / STOP TEST
    ========================================================= */

    async function hangUpSIP() {
      const session = sipSession;

      try {
        if (session) {
          if (session.state === SessionState.Established) {
            await session.bye();
          } else if (
            session.state === SessionState.Initial &&
            typeof session.reject === "function"
          ) {
            await session.reject();
          }
        }
      } catch (error) {
        console.error("Hangup error:", error);
      }

      cleanupCall();
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    registerBtn.onclick = async () => {
      /*
       * Read SIP credentials only when the user clicks Start SIP.
       * No SIP connection is created before this point.
       */
      SIP_DOMAIN = sipDomainInput.value.trim();
      SIP_USERNAME = sipUsernameInput.value.trim();
      SIP_PASSWORD = sipPasswordInput.value;

      if (!SIP_DOMAIN || !SIP_USERNAME || !SIP_PASSWORD) {
        setStatus("Please enter SIP domain, username, and password.", "error");
        return;
      }

      registerBtn.disabled = true;
      setStatus("Validating SIP credentials...");

      /* Create + resume the AudioContext inside the click so the browser
         allows it to keep running when a call arrives later. */
      try {
        await getAudioContext();
      } catch (error) {
        console.warn("Could not create AudioContext yet:", error);
      }

      await initializeSIP();

      /*
       * initializeSIP() enables/disables the button after successful
       * registration. Re-enable it if registration failed.
       */
      if (!isRegistered) {
        registerBtn.disabled = false;
      }
    };

    testBtn.onclick = async () => {
      await testAIPipeline();
    };

    hangupBtn.onclick = async () => {
      await hangUpSIP();
    };


    /* =========================================================
       PAGE CLEANUP
    ========================================================= */

    window.addEventListener("beforeunload", () => {
      /* Don't await here. */

      if (aiWs && aiWs.readyState === WebSocket.OPEN) {
        aiWs.close();
      }

      if (sipSession && sipSession.state === SessionState.Established) {
        try {
          sipSession.bye();
        } catch (error) {}
      }

      if (registerer) {
        try {
          registerer.unregister();
        } catch (error) {}
      }

      if (userAgent) {
        try {
          userAgent.stop();
        } catch (error) {}
      }
    });

  </script>

</body>

</html>
